
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerryHash • Siembra • Riega • Gana</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#fff8f0] text-slate-800">

    <!-- Top Bar -->
    <div class="bg-white border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-[1180px] mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="flex items-center gap-x-2">
                    <span class="text-3xl">🍓</span>
                    <div>
                        <span class="font-extrabold text-2xl tracking-tight">BerryHash</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center gap-x-1.5 text-xs px-3 py-1 bg-emerald-50 text-emerald-700 rounded-2xl font-medium">
                    <i class="fa-solid fa-globe fa-sm"></i>
                    <span>v2.5</span>
                </div>
            </div>

            <div class="flex items-center gap-x-3">
                <!-- Stats -->
                <div class="hidden md:flex items-center gap-x-4 text-sm">
                    <div class="flex items-center gap-x-2 bg-white border border-emerald-200 px-4 py-1.5 rounded-2xl">
                        <i class="fa-solid fa-wallet text-emerald-600"></i>
                        <div>
                            <span class="font-extrabold" id="usdc-balance">124.50</span>
                            <span class="text-xs text-emerald-600">USDC</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-x-2 bg-white border border-sky-200 px-4 py-1.5 rounded-2xl">
                        <i class="fa-solid fa-tint text-sky-600"></i>
                        <div>
                            <span class="font-extrabold" id="water-balance">48</span>
                            <span class="text-xs text-sky-600">Agua</span>
                        </div>
                    </div>
                </div>

                <!-- Wallet -->
                <div id="wallet-section">
                    <button onclick="connectPhantomWallet()" 
                            class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-700 hover:to-violet-700 text-white font-extrabold text-sm rounded-[2.25rem] flex items-center gap-x-2 active:scale-[0.985]">
                        <i class="fa-brands fa-solana"></i>
                        <span>Conectar Phantom</span>
                    </button>
                </div>

                <!-- Language + VIP -->
                <select onchange="setLanguage(this.value)" class="px-3 py-2 text-sm font-bold rounded-2xl border border-emerald-200 bg-white">
                    <option value="es">🇪🇸 ES</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="zh">🇨🇳 ZH</option>
                    <option value="fr">🇫🇷 FR</option>
                </select>

                <button onclick="showVIPPass()" class="px-5 py-2.5 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-600 hover:to-amber-700 text-white font-extrabold text-sm rounded-[2.25rem] flex items-center gap-x-2 active:scale-[0.985] shadow-lg">
                    <i class="fa-solid fa-crown"></i>
                    <span data-i18n="buy_vip">VIP Pass</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-[1180px] mx-auto px-6 pt-6">
        <div class="flex bg-white border border-emerald-100 rounded-3xl p-1.5 shadow-sm mb-6 w-fit flex-wrap gap-1">
            <button onclick="switchTab('farm')" id="tab-farm" class="nav-tab active flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-seedling"></i><span data-i18n="tab_farm">Granja</span>
            </button>
            <button onclick="switchTab('missions')" id="tab-missions" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-tasks"></i><span data-i18n="tab_missions">Misiones</span>
            </button>
            <button onclick="switchTab('rewards')" id="tab-rewards" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-play-circle"></i><span data-i18n="tab_videos">Ver Videos</span>
            </button>
            <button onclick="switchTab('shop')" id="tab-shop" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-store"></i><span data-i18n="tab_shop">Tienda</span>
            </button>
            <button onclick="switchTab('referrals')" id="tab-referrals" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-users"></i><span data-i18n="tab_referrals">Referidos</span>
            </button>
            <button onclick="switchTab('withdrawals')" id="tab-withdrawals" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-wallet"></i><span data-i18n="tab_withdrawals">Retiros</span>
            </button>
            <button onclick="switchTab('explore')" id="tab-explore" class="nav-tab flex items-center gap-x-2 px-6 py-2.5 text-sm font-extrabold rounded-[2.25rem]">
                <i class="fa-solid fa-search"></i><span data-i18n="tab_explore">Explorar</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-[1180px] mx-auto px-6 pb-12">
        
        <!-- FARM SECTION -->
        <div id="content-farm">
            <!-- Content will be injected by JavaScript -->
            <div class="text-center py-12">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full"></div>
                <p class="mt-4 text-emerald-600">Cargando granja...</p>
            </div>
        </div>

        <!-- Other sections will be added similarly -->
    </div>

    <!-- Scripts -->
    <script src="js/script.js"></script>
</body>
</html>
